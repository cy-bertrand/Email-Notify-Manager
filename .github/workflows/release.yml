name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Create Release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release archive
        run: |
          mkdir release
          cp -r custom_components/email_notify_manager release/
          cp -r www release/
          cd release && zip -r ../email-notify-manager.zip .
      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: email-notify-manager.zip
